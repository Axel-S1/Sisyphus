# docker-compose.yml — Sisyphus Control Plane (Phase 3)
#
# Control Plane: Paperclip (ghcr.io/paperclipai/paperclip) + PostgreSQL.
# The Execution Plane (goose serve / hermes gateway) runs natively on the host,
# spawned on demand by the Host Launcher (ADR-07) — execution-plane/scripts/launcher.py.
#
# Real Paperclip image contract (docs.paperclip.ing/reference/deploy/docker/):
#   - serves UI+API on container port 3100 (HOST=0.0.0.0, PORT=3100, SERVE_UI=true)
#   - external PostgreSQL via DATABASE_URL; Drizzle schema auto-migrates at boot
#   - adapters are configured via the Paperclip UI/API as secret references —
#     see control-plane/paperclip/config/adapters.json for the Sisyphus adapter
#     contract (network-only, no hermes_local inside the container — ADR-01).
#
# Linux note: containers reach host daemons via host.docker.internal,
# mapped with extra_hosts: host-gateway (R9: daemons must bind 0.0.0.0).
services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip_control_plane
    restart: unless-stopped
    # Ceiling on processes (per upstream compose): tini is PID 1 and reaps
    # orphaned agent descendants; pids_limit is the visible-failure backstop.
    pids_limit: 2048
    # Includes the shared 30s adapter-settlement window and final cleanup.
    stop_grace_period: 90s
    ports:
      - "3000:3100" # spec §5.2: Paperclip UI/API on host :3000; real image serves :3100
    environment:
      HOST: "0.0.0.0"
      PORT: "3100"
      SERVE_UI: "true"
      NODE_ENV: production
      # ── Persistence: external PostgreSQL + Drizzle (spec §2.2) ──
      DATABASE_URL: postgres://paperclip:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/paperclip
      # ── Paperclip runtime ──
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      # ── LLM provider keys (at least one needed for agent runs; not required
      #    for Phase 3 smoke-ticket validation) ──
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # NOTE: adapter secrets (API_SERVER_KEY for Hermes, GOOSE_SERVER__SECRET_KEY
      # for goose serve) are intentionally NOT injected here. They are stored as
      # Paperclip secret references when adapters are configured via UI/API.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage/paperclip_data:/paperclip
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: paperclip_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: paperclip
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./storage/paperclip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 3s
      retries: 10
